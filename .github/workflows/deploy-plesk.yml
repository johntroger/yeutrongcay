name: Build & Deploy to Plesk Mắt Bão (yeutrongcay.com)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Test Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Static typecheck
        run: npm run typecheck

      - name: 5. Build Vite SPA
        run: npm run build

      - name: 6. Assemble Production Payload
        run: |
          mkdir -p dist/api dist/uploads dist/migrations
          cp -r api/* dist/api/ 2>/dev/null || true
          cp uploads/.htaccess dist/uploads/.htaccess 2>/dev/null || true
          cp public/.htaccess dist/.htaccess 2>/dev/null || true
          cp -r migrations/* dist/migrations/ 2>/dev/null || true
          touch dist/uploads/index.html
          echo "<?php header('HTTP/1.0 403 Forbidden'); exit; ?>" > dist/uploads/index.php
          echo "yeutrongcay.com build completed at $(date -u)" > dist/build-info.txt

      - name: 7. Deploy to 'production' Branch (For Plesk Git Extension)
        uses: s0/git-publish-subdir-action@v2.6.0
        env:
          REPO: self
          BRANCH: production
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "deploy: sync production build to Plesk ({sha})"
        continue-on-error: true

      - name: 8. Trigger Plesk Git Webhook (If configured)
        if: env.PLESK_WEBHOOK != ''
        env:
          PLESK_WEBHOOK: ${{ secrets.PLESK_GIT_WEBHOOK_URL }}
        run: |
          curl -k -X POST "$PLESK_WEBHOOK" || echo "Webhook trigger completed"

      - name: 9. FTP Deploy to Plesk (Alternative if FTP credentials provided)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.PLESK_FTP_HOST }}
        with:
          server: ${{ secrets.PLESK_FTP_HOST }}
          username: ${{ secrets.PLESK_FTP_USER }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          server-dir: /
          local-dir: dist/
          protocol: ftp
