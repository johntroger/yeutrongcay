<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=1200">
  <title>Yêu Trồng Cây // Square Banner 1200x1200px SEO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=JetBrains+Mono:wght@600;700;800&family=Lexend:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background-color: #F8FAF8;
      color: #072618;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .square-canvas {
      position: relative;
      width: 1200px;
      height: 1200px;
      overflow: hidden;
    }

    /* Key Visual Background */
    .bg-image {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 78% center;
      z-index: 0;
    }

    /* Soft Gradient Overlay for Text Clarity */
    .gradient-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 26% 46%, 
        rgba(248, 250, 248, 0.98) 0%, 
        rgba(248, 250, 248, 0.94) 44%, 
        rgba(248, 250, 248, 0.52) 64%, 
        rgba(248, 250, 248, 0) 84%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Fine Framing Lines */
    .frame-border {
      position: absolute;
      inset: 32px;
      border: 1.5px solid rgba(7, 38, 24, 0.08);
      pointer-events: none;
      z-index: 10;
    }
    .corner-mark {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #059669;
      border-style: solid;
      pointer-events: none;
      z-index: 10;
    }
    .cm-tl { top: 26px; left: 26px; border-width: 2.5px 0 0 2.5px; }
    .cm-tr { top: 26px; right: 26px; border-width: 2.5px 2.5px 0 0; }
    .cm-bl { bottom: 26px; left: 26px; border-width: 0 0 2.5px 2.5px; }
    .cm-br { bottom: 26px; right: 26px; border-width: 0 2.5px 2.5px 0; }

    /* Main Content Box - Fits perfectly inside 1200x1200 */
    .content-box {
      position: relative;
      width: 66%;
      height: 100%;
      padding: 68px 30px 68px 75px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }

    /* Logo Strip */
    .top-strip {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid rgba(5, 150, 105, 0.25);
      border-radius: 14px;
      padding: 10px 18px;
      box-shadow: 0 6px 20px rgba(7, 38, 24, 0.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
    .reposition-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #E8F5EE;
      border: 1.5px solid rgba(5, 150, 105, 0.35);
      color: #047857;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
    }

    /* Core Hero Headline */
    .headline-block {
      margin-top: 15px;
      margin-bottom: 20px;
    }
    .brand-title {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 78px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1.5px;
      color: #072618;
      text-transform: uppercase;
      padding-top: 10px;
    }
    .highlight-title {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 66px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #059669 0%, #0D9488 55%, #0284C7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-top: 14px;
      padding-bottom: 4px;
      text-transform: uppercase;
      display: inline-block;
    }
    .sub-tagline {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 21px;
      font-weight: 600;
      color: #1A442E;
      line-height: 1.45;
      margin-top: 16px;
      letter-spacing: 0.2px;
      max-width: 95%;
    }
    .tech-pill {
      display: inline-block;
      background: rgba(2, 132, 199, 0.1);
      border: 1.5px solid rgba(2, 132, 199, 0.3);
      color: #0284C7;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* Bottom Gateway Card (QR Code) */
    .bottom-gateway {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(5, 150, 105, 0.28);
      border-radius: 18px;
      padding: 16px 24px;
      box-shadow: 0 12px 30px rgba(7, 38, 24, 0.08);
      width: fit-content;
    }
    .qr-frame {
      width: 104px;
      height: 104px;
      background: #FFFFFF;
      border: 1.5px solid #059669;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.15);
    }
    .qr-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .qr-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #059669;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qr-domain {
      font-family: 'Lexend', 'Be Vietnam Pro', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #072618;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .qr-desc {
      font-size: 13px;
      color: #385E49;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="square-canvas">
    <!-- Key Visual Background -->
    <img src="banner-bg-hero.jpg" alt="Digital Agriculture Sprout Key Visual" class="bg-image">

    <!-- Gradient Overlay for Contrast -->
    <div class="gradient-overlay"></div>

    <!-- Framing Accents -->
    <div class="frame-border"></div>
    <div class="corner-mark cm-tl"></div>
    <div class="corner-mark cm-tr"></div>
    <div class="corner-mark cm-bl"></div>
    <div class="corner-mark cm-br"></div>

    <!-- Main Editorial Content Architecture -->
    <main class="content-box">
      <!-- Top Strip: Logo & Badge -->
      <div class="top-strip">
        <div class="logo-card">
          <img src="logo-sharpened.png" alt="Logo Yêu Trồng Cây" class="brand-logo-img">
        </div>
        <span class="reposition-pill">
          <span class="pulse-dot"></span>
          TÁI ĐỊNH VỊ 2026
        </span>
      </div>

      <!-- Center Headline Block -->
      <div class="headline-block">
        <h1 class="brand-title">YÊU TRỒNG CÂY</h1>
        <div>
          <span class="highlight-title">NÔNG NGHIỆP SỐ</span>
        </div>
        <p class="sub-tagline">
          Tiên phong ứng dụng Trí Tuệ Nhân Tạo & Blockchain vào hệ sinh thái nông nghiệp thông minh
          <span class="tech-pill">AI ✕ WEB3</span>
        </p>
      </div>

      <!-- Bottom QR Code Gateway (100% Complete & Unclipped) -->
      <div class="bottom-gateway">
        <div class="qr-frame">
          <!-- Vector QR Code for https://yeutrongcay.com/ -->

          </svg>
        </div>
        <div class="qr-meta">
          <div class="qr-label">
            <span class="pulse-dot" style="width: 7px; height: 7px;"></span>
            QUÉT ĐỂ TRẢI NGHIỆM
          </div>
          <div class="qr-domain">yeutrongcay.com</div>
          <div class="qr-desc">Nền tảng Nông Nghiệp Số thế hệ mới</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
